name: korp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-korp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-korp_dev_password}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  inventory-api:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InventoryDatabase: Host=postgres;Port=5432;Database=inventory_db;Username=${POSTGRES_USER:-korp_app};Password=${POSTGRES_PASSWORD:-korp_dev_password}
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-4200}
    ports:
      - "${INVENTORY_PORT:-5001}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  billing-api:
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BillingDatabase: Host=postgres;Port=5432;Database=billing_db;Username=${POSTGRES_USER:-korp_app};Password=${POSTGRES_PASSWORD:-korp_dev_password}
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-4200}
      # Server-to-server call inside the Docker network — the service DNS
      # name, not localhost (localhost inside a container is the container
      # itself). The browser-facing URLs are separate: Angular is built with
      # http://localhost:5001 / :5002 baked in, reached through the ports
      # mapped below, since the browser runs on the host, outside this network.
      Inventory__BaseUrl: http://inventory-api:8080/
      Inventory__TimeoutSeconds: "5"
    ports:
      - "${BILLING_PORT:-5002}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-api:
        condition: service_started

  frontend:
    build:
      context: ./frontend/korp-web
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - inventory-api
      - billing-api

volumes:
  postgres_data:
