<section class="page page--narrow">
  <header class="page__header">
    <h1 class="page__title">Novo produto</h1>
  </header>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="code">Código</label>
      <input
        id="code"
        type="text"
        formControlName="code"
        [attr.aria-describedby]="fieldError('code') ? 'code-error' : null"
      />
      @if (fieldError('code'); as message) {
        <p id="code-error" class="field__error" role="alert">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label for="description">Descrição</label>
      <input
        id="description"
        type="text"
        formControlName="description"
        [attr.aria-describedby]="fieldError('description') ? 'description-error' : null"
      />
      @if (fieldError('description'); as message) {
        <p id="description-error" class="field__error" role="alert">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label for="stock">Saldo</label>
      <input
        id="stock"
        type="number"
        step="1"
        min="0"
        formControlName="stock"
        [attr.aria-describedby]="fieldError('stock') ? 'stock-error' : null"
      />
      @if (fieldError('stock'); as message) {
        <p id="stock-error" class="field__error" role="alert">{{ message }}</p>
      }
    </div>

    @if (errorMessage(); as message) {
      <div class="alert alert--danger" role="alert">{{ message }}</div>
    }

    <div class="form__actions">
      <a class="btn btn--secondary" routerLink="/produtos">Cancelar</a>
      <button type="submit" class="btn btn--primary" [disabled]="saving()">
        {{ saving() ? 'Salvando...' : 'Salvar' }}
      </button>
    </div>
  </form>
</section>
